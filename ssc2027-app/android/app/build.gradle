plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Version: CI passes -PversionCode=<run number> -PversionName=<tag>; local builds use defaults
// ---------------------------------------------------------------------------
def vCode = (project.findProperty('versionCode') ?: '1').toString().toInteger()
def vName = (project.findProperty('versionName') ?: '1.0.0').toString()

// ---------------------------------------------------------------------------
// Signing: 1) GitHub Secrets (env vars)  2) android/keystore.properties  3) debug key
// ---------------------------------------------------------------------------
def ksProps = new Properties()
def ksPropsFile = rootProject.file('keystore.properties')
if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }
def envKs = System.getenv('SSC_KEYSTORE_FILE')
def ksFile = envKs ? file(envKs) : (ksProps['storeFile'] ? rootProject.file(ksProps['storeFile']) : null)
def ksPass = System.getenv('SSC_KEYSTORE_PASSWORD') ?: ksProps['storePassword']
def ksAlias = System.getenv('SSC_KEY_ALIAS') ?: ksProps['keyAlias']
def ksKeyPass = System.getenv('SSC_KEY_PASSWORD') ?: ksProps['keyPassword']
def hasRelease = ksFile != null && ksFile.exists() && ksPass && ksAlias

android {
    namespace 'com.ssc2027.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ssc2027.app'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        if (hasRelease) {
            release {
                storeFile ksFile
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass ?: ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasRelease ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // The web app (repo root) is bundled into the APK as assets/www
    sourceSets {
        main {
            assets.srcDirs = [layout.buildDirectory.dir('generated/webassets').get().asFile]
        }
    }
}

// Copies the PWA from the repository root into the APK on every build,
// so the website and the Android app always share the exact same code.
def webRoot = rootProject.file('..')
tasks.register('copyWebApp', Sync) {
    from(webRoot) {
        include 'index.html', 'manifest.webmanifest', 'sw.js'
        include 'css/**', 'js/**', 'assets/**', 'icons/**', 'fonts/**'
    }
    into layout.buildDirectory.dir('generated/webassets/www')
}
tasks.named('preBuild') { dependsOn 'copyWebApp' }
